<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Flix — Quem está assistindo?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #07080a; color: #f3f4f6; }
    </style>
</head>
<body class="bg-[#07080a] min-h-screen flex flex-col items-center justify-center px-4">

    <div class="text-center mb-10">
        <h1 class="text-4xl md:text-5xl font-black text-red-600 tracking-wider mb-2">ALEX FLIX</h1>
        <p class="text-gray-400 text-lg font-medium">Quem está assistindo?</p>
    </div>

    <!-- Grade Dinâmica de Perfis -->
    <div id="profiles-container" class="flex flex-wrap justify-center gap-6 max-w-4xl mb-10">
        <!-- Renderizado via JavaScript -->
    </div>

    <!-- Botão para Adicionar Novo Perfil -->
    <button onclick="openAddProfileModal()" class="flex items-center space-x-2 text-gray-400 hover:text-white bg-gray-900/80 hover:bg-gray-800 px-6 py-3 rounded-xl border border-gray-800 transition">
        <i class="fa-solid fa-user-plus"></i>
        <span class="font-semibold text-sm">Adicionar Perfil</span>
    </button>

    <!-- Modal para Criar Novo Perfil -->
    <div id="profile-modal" class="fixed inset-0 bg-black/9ul0 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-[#111318] p-6 rounded-2xl border border-gray-800 shadow-2xl relative">
            <h3 class="text-xl font-bold mb-4 text-white">Criar Novo Perfil</h3>
            <form onsubmit="saveNewProfile(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Nome do Perfil</label>
                    <input type="text" id="new-profile-name" required placeholder="Ex: Esposa, Filho, Convidado..." class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeAddProfileModal()" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-3 rounded-xl transition">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-red-600 hover:bg-red-700 text-white font-semibold py-3 rounded-xl transition">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Perfis padrão iniciais caso o usuário não tenha criado outros
        let profiles = JSON.parse(localStorage.getItem('alex_flix_profiles')) || [
            { name: 'Alex', color: 'from-red-600 to-purple-800' },
            { name: 'Convidado', color: 'from-gray-700 to-gray-900' }
        ];

        function renderProfiles() {
            const container = document.getElementById('profiles-container');
            container.innerHTML = '';
            
            profiles.forEach((profile, index) => {
                const card = document.createElement('div');
                card.className = 'group text-center cursor-pointer';
                card.onclick = () => selectProfile(profile.name);
                card.innerHTML = `
                    <div class="w-28 h-28 md:w-36 md:h-36 rounded-2xl overflow-hidden border-2 border-transparent group-hover:border-red-600 transition-all shadow-2xl relative bg-gradient-to-br ${profile.color} flex items-center justify-center text-4xl font-black transform group-hover:scale-105">
                        ${profile.name.charAt(0).toUpperCase()}
                    </div>
                    <span class="block mt-3 text-gray-400 group-hover:text-white font-semibold text-base transition">${profile.name}</span>
                `;
                container.appendChild(card);
            });
        }

        function selectProfile(profileName) {
            localStorage.setItem('alex_flix_current_profile', profileName);
            window.location.href = 'index.html';
        }

        function openAddProfileModal() {
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeAddProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function saveNewProfile(event) {
            event.preventDefault();
            const name = document.getElementById('new-profile-name').value;
            const colors = [
                'from-blue-600 to-indigo-900',
                'from-pink-600 to-purple-900',
                'from-green-600 to-teal-900',
                'from-amber-600 to-orange-900'
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            profiles.push({ name, color: randomColor });
            localStorage.setItem('alex_flix_profiles', JSON.stringify(profiles));
            closeAddProfileModal();
            renderProfiles();
        }

        renderProfiles();
    </script>
</body>
</html>
