<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Flix — Checkout Seguro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #07080a; color: #f3f4f6; }
    </style>
</head>
<body class="bg-[#07080a] min-h-screen flex items-center justify-center px-4 py-12">

    <div class="w-full max-w-lg bg-[#111318] p-8 rounded-3xl border border-gray-800 shadow-2xl">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-red-600 tracking-wider mb-1">GARANTA SEUS 7 DIAS GRÁTIS</h1>
            <p id="resumo-pedido" class="text-gray-400 text-sm">Nenhuma cobrança hoje. Cancele quando quiser.</p>
        </div>

        <form onsubmit="ativarTesteGratis(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Seu E-mail</label>
                <input type="email" id="cliente-email" required placeholder="seu@email.com" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Nome Completo</label>
                <input type="text" id="cliente-nome" required placeholder="Alex da Silva" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <!-- Seleção de Forma de Pagamento Recorrente -->
            <div class="pt-2">
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Método de Cobrança Futura (Após os 7 dias)</label>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <button type="button" onclick="mudarMetodo('cartao')" id="btn-cartao" class="bg-red-600 text-white font-bold py-3 rounded-xl border border-red-600 text-xs transition">Cartão de Crédito</button>
                    <button type="button" onclick="mudarMetodo('pix')" id="btn-pix" class="bg-black/60 text-gray-300 font-bold py-3 rounded-xl border border-gray-700 text-xs transition">Pix Automático</button>
                </div>
            </div>

            <!-- Campos do Cartão -->
            <div id="bloco-cartao" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Número do Cartão</label>
                    <input type="text" id="card-num" placeholder="4532 •••• •••• 8921" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" placeholder="MM/AA" class="bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
                    <input type="text" placeholder="CVV" class="bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
                </div>
            </div>

            <!-- Campos do Pix Automático -->
            <div id="bloco-pix" class="hidden text-center space-y-4 bg-black/40 p-4 rounded-2xl border border-gray-800">
                <p class="text-xs text-gray-300">Cadastre a Chave Pix Recorrente (CPF) para autorizar os débitos automáticos mensais/anuais após o período de teste:</p>
                <input type="text" value="81188331272 (Sua Chave Pix)" readonly class="w-full bg-black/80 border border-gray-700 rounded-xl px-4 py-3 text-center text-xs text-green-400 font-bold">
                <p class="text-[11px] text-gray-500">Será gerada uma autorização direta no seu banco parceiro no 8º dia.</p>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition shadow-xl mt-6">
                Iniciar Teste Grátis de 7 Dias
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="planos.html" class="text-xs text-gray-500 hover:text-gray-300 transition">&larr; Voltar aos planos</a>
        </div>
    </div>

    <script>
        const plano = JSON.parse(localStorage.getItem('alex_flix_plano_selecionado')) || { nome: 'Plano Mensal', preco: '19,90', tipo: 'mensal' };
        document.getElementById('resumo-pedido').innerText = `${plano.nome} — R$ ${plano.preco} após 7 dias grátis`;

        let metodoAtual = 'cartao';
        function mudarMetodo(metodo) {
            metodoAtual = metodo;
            if(metodo === 'cartao') {
                document.getElementById('btn-cartao').className = 'bg-red-600 text-white font-bold py-3 rounded-xl border border-red-600 text-xs transition';
                document.getElementById('btn-pix').className = 'bg-black/60 text-gray-300 font-bold py-3 rounded-xl border border-gray-700 text-xs transition';
                document.getElementById('bloco-cartao').classList.remove('hidden');
                document.getElementById('bloco-pix').classList.add('hidden');
            } else {
                document.getElementById('btn-pix').className = 'bg-red-600 text-white font-bold py-3 rounded-xl border border-red-600 text-xs transition';
                document.getElementById('btn-cartao').className = 'bg-black/60 text-gray-300 font-bold py-3 rounded-xl border border-gray-700 text-xs transition';
                document.getElementById('bloco-pix').classList.remove('hidden');
                document.getElementById('bloco-cartao').classList.add('hidden');
            }
        }

        function ativarTesteGratis(event) {
            event.preventDefault();
            const email = document.getElementById('cliente-email').value.trim().toLowerCase();
            const nome = document.getElementById('cliente-nome').value;

            // Calcula 7 dias a partir de hoje para expiração do teste
            let agora = new Date();
            let seteDiasFrente = agora.getTime() + (7 * 24 * 60 * 60 * 1000);

            let clientes = JSON.parse(localStorage.getItem('alex_flix_base_clientes')) || {};
            clientes[email] = {
                nome: nome,
                tipo: plano.tipo,
                expiraEm: seteDiasFrente,
                metodo: metodoAtual
            };

            localStorage.setItem('alex_flix_base_clientes', JSON.stringify(clientes));
            localStorage.setItem('alex_flix_auth', 'true');
            localStorage.setItem('alex_flix_account_owner', email);
            localStorage.setItem('alex_flix_status_assinatura', plano.tipo);

            alert('Parabéns! Seus 7 dias grátis foram ativados com sucesso. Aproveite o Alex Flix!');
            window.location.href = 'perfis.html';
        }
    </script>
</body>
</html>
