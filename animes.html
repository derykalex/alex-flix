<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Flix — Animes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #07080a; color: #f3f4f6; }
    </style>
</head>
<body class="bg-[#07080a] min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 right-0 z-40 bg-[#07080a]/90 backdrop-blur-md border-b border-gray-900 px-6 md:px-12 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-10">
            <h2 class="text-2xl font-black text-red-600 tracking-wider cursor-pointer" onclick="location.href='index.html'">ALEX FLIX</h2>
            <nav class="hidden md:flex space-x-8 text-sm font-semibold text-gray-300">
                <a href="index.html" class="hover:text-white transition">Início</a>
                <a href="animes.html" class="text-white transition font-bold">Animes</a>
                <a href="filmes.html" class="hover:text-white transition">Filmes</a>
                <a href="series.html" class="hover:text-white transition">Séries</a>
                <a href="minha-lista.html" class="text-red-500 hover:text-red-400 transition">Minha Lista (<span id="list-count">0</span>)</a>
            </nav>
        </div>
        
        <div class="relative">
            <div onclick="toggleProfileMenu(event)" class="flex items-center space-x-3 bg-black/40 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-gray-800 shadow-md cursor-pointer hover:border-gray-600 transition">
                <div class="w-7 h-7 bg-red-600 rounded-full flex items-center justify-center font-bold text-xs text-white">A</div>
                <span id="current-profile-name" class="text-sm font-semibold text-white hidden sm:inline">Alex</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </div>
            <div id="profile-dropdown" class="absolute right-0 mt-2 w-56 bg-[#111318] border border-gray-800 rounded-2xl shadow-2xl py-2 hidden z-50">
                <a href="perfis.html" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-user w-6 text-red-500"></i> Perfil</a>
                <a href="minha-lista.html" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-bookmark w-6 text-red-500"></i> Acompanhando</a>
                <a href="#" onclick="showSectionAlert('Histórico')" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-clock-rotate-left w-6 text-red-500"></i> Histórico</a>
                <a href="#" onclick="showSectionAlert('Ver depois')" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-clock w-6 text-red-500"></i> Ver depois</a>
                <div class="border-t border-gray-800 my-1"></div>
                <a href="#" onclick="showSectionAlert('Configurações')" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition"><i class="fa-solid fa-gear w-6 text-red-500"></i> Configurações</a>
                <a href="login.html" class="flex items-center px-4 py-3 text-sm text-red-400 hover:bg-red-600/20 hover:text-red-300 transition"><i class="fa-solid fa-right-from-bracket w-6"></i> Sair da Conta</a>
            </div>
        </div>
    </header>

    <main class="flex-grow px-6 md:px-12 mt-28 pb-20">
        <h1 class="text-3xl md:text-4xl font-black mb-8 flex items-center"><i class="fa-solid fa-fire text-red-600 mr-3"></i> Todos os Animes</h1>
        <div id="grid-animes" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
    </main>

    <div id="player-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-5xl bg-[#111318] rounded-2xl overflow-hidden border border-gray-800 shadow-2xl relative">
            <button onclick="closePlayer()" class="absolute top-5 right-5 z-25 bg-black/70 hover:bg-red-600 text-white w-11 h-11 rounded-full flex items-center justify-center transition border border-gray-700"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="relative h-64 md:h-[400px] bg-black flex items-center justify-center">
                <img id="modal-img" src="" class="absolute inset-0 w-full h-full object-cover opacity-40">
                <div class="z-10 text-center px-4">
                    <button class="w-20 h-20 bg-red-600 text-white rounded-full flex items-center justify-center text-3xl mx-auto shadow-2xl"><i class="fa-solid fa-play ml-1"></i></button>
                    <p id="modal-title" class="mt-4 text-2xl font-bold text-white"></p>
                </div>
            </div>
            <div class="p-6 bg-[#111318]"><p id="modal-desc" class="text-gray-300 text-sm"></p></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>renderGrid('grid-animes', catalog.filter(i => i.category === 'anime'));</script>
</body>
</html>
