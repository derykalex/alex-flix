<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Flix — Configurações da Conta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #07080a; color: #f3f4f6; }
    </style>
</head>
<body class="bg-[#07080a] min-h-screen flex flex-col">
    <header class="fixed top-0 left-0 right-0 z-40 bg-[#07080a]/95 backdrop-blur-md border-b border-gray-900 px-6 md:px-12 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-10">
            <h2 class="text-2xl font-black text-red-600 tracking-wider cursor-pointer" onclick="location.href='index.html'">ALEX FLIX</h2>
            <nav class="hidden md:flex space-x-8 text-sm font-semibold text-gray-300">
                <a href="index.html" class="hover:text-white transition">Início</a>
                <a href="animes.html" class="hover:text-white transition">Animes</a>
                <a href="filmes.html" class="hover:text-white transition">Filmes</a>
                <a href="series.html" class="hover:text-white transition">Séries</a>
                <a href="minha-lista.html" class="hover:text-white transition">Minha Lista</a>
            </nav>
        </div>
        <div class="relative">
            <div onclick="toggleProfileMenu(event)" class="flex items-center space-x-3 bg-black/40 px-3.5 py-1.5 rounded-full border border-gray-800 cursor-pointer">
                <div class="w-7 h-7 bg-red-600 rounded-full flex items-center justify-center font-bold text-xs text-white">A</div>
                <span id="current-profile-name" class="text-sm font-semibold text-white">Alex</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
            </div>
            <div id="profile-dropdown" class="absolute right-0 mt-2 w-56 bg-[#111318] border border-gray-800 rounded-2xl shadow-2xl py-2 hidden z-50">
                <a href="perfis.html" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-user w-6 text-red-500"></i> Perfil</a>
                <a href="minha-lista.html" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-bookmark w-6 text-red-500"></i> Acompanhando</a>
                <a href="historico.html" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-clock-rotate-left w-6 text-red-500"></i> Histórico</a>
                <a href="ver-depois.html" class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white"><i class="fa-solid fa-clock w-6 text-red-500"></i> Ver depois</a>
                <div class="border-t border-gray-800 my-1"></div>
                <a href="configuracoes.html" class="flex items-center px-4 py-3 text-sm text-white bg-gray-800"><i class="fa-solid fa-gear w-6 text-red-500"></i> Configurações</a>
                <a href="login.html" class="flex items-center px-4 py-3 text-sm text-red-400 hover:bg-red-600/20"><i class="fa-solid fa-right-from-bracket w-6"></i> Sair da Conta</a>
            </div>
        </div>
    </header>

    <main class="flex-grow px-6 md:px-12 mt-32 max-w-3xl mx-auto w-full pb-20">
        <h1 class="text-3xl font-black mb-8 flex items-center"><i class="fa-solid fa-gear text-red-600 mr-3"></i> Configurações da Conta</h1>
        
        <div class="bg-[#111318] border border-gray-800 rounded-3xl p-6 md:p-8 space-y-6 shadow-2xl">
            <div>
                <h3 class="text-lg font-bold text-white mb-2">Perfil Atual Selecionado</h3>
                <p id="config-perfil-nome" class="text-red-500 font-bold text-xl">Alex</p>
            </div>
            <div class="border-t border-gray-800 pt-4">
                <h3 class="text-lg font-bold text-white mb-2">Plano de Assinatura</h3>
                <p class="text-gray-300 text-sm">Status: <span class="text-green-400 font-semibold">Ativo (7 Dias Grátis / Recorrente)</span></p>
            </div>
            <div class="border-t border-gray-800 pt-4">
                <h3 class="text-lg font-bold text-white mb-2">Gerenciamento</h3>
                <a href="perfis.html" class="inline-block bg-gray-800 hover:bg-gray-700 text-white font-semibold px-6 py-3 rounded-xl transition text-sm">Gerenciar Perfis</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
    <script>
        document.getElementById('config-perfil-nome').innerText = localStorage.getItem('alex_flix_current_profile') || 'Alex';
    </script>
</body>
</html>
