<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex Flix — Cadastro e Confirmação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #07080a; color: #f3f4f6; }
    </style>
</head>
<body class="bg-[#07080a] min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg bg-[#111318] p-8 rounded-3xl border border-gray-800 shadow-2xl">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-red-600 tracking-wider mb-1">CRIE SUA CONTA</h1>
            <p class="text-gray-400 text-xs">7 dias gratuitos de amostra para novos usuários</p>
        </div>

        <!-- ETAPA 1: Formulário de Pré-Cadastro -->
        <form id="form-cadastro" onsubmit="enviarPreCadastro(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Seu Nome</label>
                <input type="text" id="cad-nome" required placeholder="Nome completo" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Seu E-mail Principal</label>
                <input type="email" id="cad-email" required placeholder="seu@email.com" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Escolha o Plano</label>
                <select id="cad-plano" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
                    <option value="mensal">Plano Mensal (R$ 19,90 / mês)</option>
                    <option value="anual">Plano Anual VIP (R$ 99,90 / ano)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Forma de Pagamento</label>
                <select id="cad-pagamento" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-red-600">
                    <option value="cartao">Cartão de Crédito (Automático após 7 dias)</option>
                    <option value="pix">Pix com Desconto / Pix Automático (Bônus de 1 mês e 7 dias)</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition shadow-xl mt-2">
                Avançar e Enviar Código por E-mail
            </button>
        </form>

        <!-- ETAPA 2: Barra / Bloco de Confirmação (Aparece logo abaixo após o envio) -->
        <div id="bloco-confirmacao" class="hidden mt-8 pt-6 border-t border-gray-800 space-y-4">
            <div class="bg-red-600/10 border border-red-600/30 p-4 rounded-2xl text-center">
                <p class="text-xs text-red-400 font-semibold mb-1"><i class="fa-solid fa-paper-plane mr-1"></i> Código enviado com sucesso!</p>
                <p class="text-xs text-gray-300">Enviamos um código aleatório de 4 dígitos para o seu e-mail. Digite-o abaixo para autenticar sua conta:</p>
            </div>

            <div>
                <input type="text" id="codigo-input" maxlength="4" placeholder="0000" class="w-full bg-black/60 border border-gray-700 rounded-xl px-4 py-3 text-center text-white text-2xl font-black tracking-widest focus:outline-none focus:ring-2 focus:ring-red-600">
            </div>

            <button onclick="validarCodigoEmail()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg">
                Confirmar Código e Liberar Acesso
            </button>
        </div>

        <div class="text-center mt-6">
            <a href="login.html" class="text-xs text-gray-400 hover:text-white transition">&larr; Já possui conta? Fazer login</a>
        </div>
    </div>

    <script>
        let emailTemporario = "";

        function enviarPreCadastro(event) {
            event.preventDefault();
            const nome = document.getElementById('cad-nome').value;
            emailTemporario = document.getElementById('cad-email').value.trim().toLowerCase();
            const plano = document.getElementById('cad-plano').value;
            const pagamento = document.getElementById('cad-pagamento').value;

            let clientes = JSON.parse(localStorage.getItem('alex_flix_base_clientes')) || {};

            // Gera senha temporária e código aleatório de 4 dígitos
            const senhaAleatoria = Math.random().toString(36).substring(2, 8).toUpperCase();
            const codigoAleatorio = Math.floor(1000 + Math.random() * 9000).toString();

            let diasTeste = (pagamento === 'pix') ? 37 : 7;
            let expiraEm = new Date().getTime() + (diasTeste * 24 * 60 * 60 * 1000);

            clientes[emailTemporario] = {
                nome: nome,
                email: emailTemporario,
                senha: senhaAleatoria,
                codigo: codigoAleatorio,
                tipo: plano,
                pagamento: pagamento,
                verificado: false,
                expiraEm: expiraEm
            };

            localStorage.setItem('alex_flix_base_clientes', JSON.stringify(clientes));

            // Simula o envio do e-mail exibindo um alerta amigável com o código gerado
            alert(`[E-MAIL SIMULADO ENVIADO PARA ${emailTemporario}]\n\nSeu código de confirmação é: ${codigoAleatorio}\nSua senha de acesso é: ${senhaAleatoria}`);

            // Oculta o formulário principal e exibe a barra de confirmação logo abaixo
            document.getElementById('form-cadastro').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('bloco-confirmacao').classList.remove('hidden');
        }

        function validarCodigoEmail() {
            const codigoDigitado = document.getElementById('codigo-input').value.trim();
            let clientes = JSON.parse(localStorage.getItem('alex_flix_base_clientes')) || {};
            let cliente = clientes[emailTemporario];

            if (!cliente) {
                alert('Erro nos dados. Tente novamente.');
                return;
            }

            if (cliente.codigo === codigoDigitado) {
                cliente.verificado = true;
                localStorage.setItem('alex_flix_base_clientes', JSON.stringify(clientes));

                alert('E-mail confirmado com sucesso! Seus 7 dias gratuitos foram ativados. Redirecionando para a tela de login...');
                window.location.href = 'login.html';
            } else {
                alert('Código incorreto. Verifique o código exibido no alerta anterior.');
            }
        }
    </script>
</body>
</html>
